<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#131210">
<title>Offline | RdyDeck</title>
<style>
  @font-face { font-family:'Saira'; src:url('saira.woff2') format('woff2'); font-weight:100 900; font-display:swap; }
  :root { color-scheme:dark; }
  html, body { margin:0; height:100%; background:#131210; color:#ede8de; font-family:'Saira', system-ui, sans-serif; }
  main { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px 16px; box-sizing:border-box; }
  img { width:72px; height:72px; margin-bottom:18px; }
  h1 { font-size:1.5rem; margin:0 0 0.5rem; font-weight:700; }
  h1 .r { color:#e5483a; }
  p { margin:0 0 1.4rem; max-width:22rem; line-height:1.5; color:#bdb6a9; }
  .acts { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
  a.b { display:inline-flex; align-items:center; font-weight:600; color:#ede8de; border:1px solid #5a554c; border-radius:4px; min-height:44px; padding:0 22px; text-decoration:none; box-sizing:border-box; }
  button { font:inherit; font-weight:600; background:#ede8de; color:#131210; border:0; border-radius:4px; min-height:44px; padding:0 22px; cursor:pointer; }
</style>
</head>
<body>
<main>
  <img src="icon-192x192.png" alt="">
  <h1><span class="r">Rdy</span>Deck</h1>
  <p>You're offline. RdyDeck needs a connection the first time it opens on this device. After that it works offline.</p>
  <div class="acts"><button onclick="location.reload()">Try again</button><a class="b" href="./">Open RdyDeck</a></div>
</main>
</body>
</html>
