# Refreshes data.json once a week: current meta and starter decks from Limitless,
# new set codes from TCGdex. Rotation is never changed here; edit it by hand.
name: Refresh data.json

on:
  schedule:
    - cron: '17 9 * * 1'   # every Monday at 09:17 UTC
  workflow_dispatch:         # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write            # lets the job commit data.json back to this repo

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Refresh data.json
        run: node scripts/refresh-data.mjs data.json

      - name: Commit if it changed
        run: |
          if git diff --quiet -- data.json; then
            echo "No change this week."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Weekly data refresh"
          git push
