<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#131210">
<title>Sparring | RdyDeck</title>
<meta name="description" content="Sparring: play five turns of a Pokémon TCG tournament deck against a computer opponent. Free, no account.">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<style>
  @font-face { font-family:'Saira'; src:url('/saira.woff2') format('woff2'); font-weight:100 900; font-display:swap; }
  :root { color-scheme:dark; --bg:#131210; --panel:#1a1814; --line:#2c2924; --text:#ede8de; --mute:#bdb6a9; --red:#e5483a; --amber:#f4b62b; }
  html, body { margin:0; background:var(--bg); color:var(--text); font-family:'Saira', system-ui, sans-serif; }
  body { padding:16px; max-width:1080px; margin:0 auto; box-sizing:border-box; }
  h1 { font-size:1.25rem; margin:0 0 12px; } h1 .r { color:var(--red); }
  .menu, .narrow { max-width:640px; }
  .menu label { display:block; margin:0 0 12px; color:var(--mute); font-size:.9rem; }
  .menu select { display:block; width:100%; margin-top:4px; min-height:44px; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:0 10px; font:inherit; }
  .note, .line, .piles, .meta { color:var(--mute); font-size:.85rem; line-height:1.45; }
  .turn { font-size:.85rem; color:var(--mute); margin-bottom:10px; }
  .lk { background:none; border:0; padding:0; font:inherit; color:var(--text); text-decoration:underline; text-underline-offset:2px; cursor:pointer; }
  .game { display:block; }
  @media (min-width:900px) { .game { display:grid; grid-template-columns:minmax(0,1fr) 360px; gap:16px; align-items:start; } .play { position:sticky; top:12px; max-height:calc(100vh - 24px); overflow:auto; } }
  .side { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:10px 12px; margin-bottom:10px; }
  .side.opp { border-left:3px solid var(--red); } .side.me { border-left:3px solid var(--text); }
  .sh { display:flex; justify-content:space-between; align-items:center; gap:8px; font-weight:700; margin-bottom:6px; } .pr { color:var(--amber); font-weight:600; font-size:.9rem; }
  .zl { display:flex; justify-content:space-between; gap:8px; font-size:.75rem; text-transform:uppercase; letter-spacing:.06em; color:var(--mute); margin:8px 0 4px; }
  /* A Pokémon: its picture, then name, HP and Energy, then its attacks. Tap for the full card. */
  .mon { display:flex; gap:10px; padding:8px 0; border-top:1px solid var(--line); cursor:pointer; border-radius:4px; }
  .mon:hover .mn b, .mon:focus-visible .mn b { text-decoration:underline; text-underline-offset:2px; } .mon:focus-visible { outline:2px solid var(--amber); outline-offset:2px; }
  .mb { flex:1; min-width:0; }
  .mn { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; } .mon.act .mn b { font-size:1.05rem; } .pv { font-size:.75rem; color:var(--amber); font-weight:500; }
  .hp { font-size:.85rem; display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:2px; } .en { display:inline-flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .bar { display:inline-block; width:72px; height:6px; background:#2c2924; border-radius:3px; overflow:hidden; } .bar i { display:block; height:100%; background:#7fb36a; } .bar.low i { background:var(--red); }
  .none { color:var(--mute); font-size:.8rem; }
  .eg { display:inline-flex; align-items:center; gap:2px; } .eg b { font-size:.8rem; font-weight:600; }
  .pip { display:inline-flex; align-items:center; justify-content:center; width:15px; height:15px; border-radius:50%; font-style:normal; font-size:9px; font-weight:800; line-height:1; color:#131210; flex:none; box-sizing:border-box; }
  .pip.ring { box-shadow:0 0 0 1.5px var(--text); }
  .t-grass { background:#78b35f; } .t-fire { background:#e2603f; } .t-water { background:#4ea3dc; } .t-lightning { background:#ecc83d; } .t-psychic { background:#aa72cc; }
  .t-fighting { background:#c47b42; } .t-darkness { background:#3f4d58; color:#ede8de; } .t-metal { background:#a2abb3; } .t-fairy { background:#e895bb; } .t-dragon { background:#b79c3e; }
  .t-colorless { background:#ddd7cb; } .t-none { background:transparent; border:1px solid var(--line); color:var(--mute); }
  .atks { margin-top:4px; }
  .atk { display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:.85rem; padding:2px 0; color:var(--mute); }
  .atk .cost { display:inline-flex; gap:2px; min-width:15px; } .atk .dmg { font-weight:700; } .atk.ok { color:var(--text); } .atk.ok .dmg { color:var(--amber); }
  .need { font-size:.75rem; color:var(--mute); border:1px solid var(--line); border-radius:10px; padding:0 7px; }
  .ab { font-size:.85rem; padding:2px 0; } .tag { font-size:.68rem; text-transform:uppercase; letter-spacing:.06em; color:var(--red); font-weight:700; }
  .wr { display:flex; gap:14px; flex-wrap:wrap; font-size:.8rem; color:var(--mute); margin-top:4px; } .wr > span { display:inline-flex; align-items:center; gap:4px; } .wr .cost { display:inline-flex; gap:2px; }
  /* Card pictures: a dark tile with the card's name shows until the picture loads, or if none does. */
  .art { position:relative; flex:none; display:block; border-radius:5px; overflow:hidden; background:#22201b; aspect-ratio:63/88; }
  .art img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .15s; } .art.loaded img { opacity:1; }
  .art .ph { position:absolute; inset:0; display:flex; align-items:flex-end; padding:4px; font-size:.6rem; line-height:1.15; color:var(--mute); border-top:3px solid; background:#22201b; box-sizing:border-box; overflow:hidden; }
  .art .ph.t-grass, .art .ph.t-fire, .art .ph.t-water, .art .ph.t-lightning, .art .ph.t-psychic, .art .ph.t-fighting, .art .ph.t-darkness, .art .ph.t-metal, .art .ph.t-fairy, .art .ph.t-dragon, .art .ph.t-colorless { background:#22201b; }
  .art.a { width:64px; } .art.b { width:46px; } .art.h { width:100%; } .art.big { width:100%; max-width:250px; margin:0 auto; }
  .bad { color:var(--red); } .empty { color:var(--mute); font-size:.85rem; }
  /* Your hand: a row of cards (scrolls sideways on a phone). Tap a card for its text. */
  .hand { margin:4px 0 12px; }
  .tiles { display:flex; align-items:flex-start; gap:8px; overflow-x:auto; padding:2px 0 6px; scrollbar-width:thin; }
  .hc { position:relative; flex:none; width:76px; background:none; border:0; padding:0; color:var(--text); font:inherit; text-align:left; cursor:pointer; }
  .hc:focus-visible { outline:2px solid var(--amber); outline-offset:2px; border-radius:5px; }
  .hn { display:block; font-size:.72rem; line-height:1.2; margin-top:4px; color:var(--mute); overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .hx { position:absolute; top:4px; right:4px; background:var(--bg); color:var(--text); font-size:.72rem; border-radius:8px; padding:1px 6px; }
  @media (min-width:900px) { .tiles { flex-wrap:wrap; overflow:visible; } }
  .acts { margin-bottom:14px; } .q { font-weight:700; margin:6px 0 8px; } .gt { font-size:.75rem; text-transform:uppercase; letter-spacing:.06em; color:var(--mute); margin:10px 0 4px; }
  .btns { display:flex; flex-wrap:wrap; gap:6px; }
  .btn { min-height:44px; padding:0 14px; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:4px; font:inherit; font-size:.9rem; cursor:pointer; text-align:left; }
  .btn:disabled { opacity:.45; cursor:default; } .btn .nt { display:block; font-size:.72rem; color:var(--mute); margin:-2px 0 6px; }
  .btn.primary { background:var(--text); color:var(--bg); border-color:var(--text); font-weight:600; } .btn.ghost { background:transparent; }
  details { margin-top:10px; color:var(--mute); font-size:.85rem; } summary { cursor:pointer; min-height:32px; }
  details li b { color:var(--text); font-weight:600; }
  /* Numbered lists: room for three digits, so "10." and "100." never get cut off on a phone. */
  .log ol { padding-left:2.8em; margin:6px 0 0; max-height:260px; overflow:auto; }
  .oppturn ol, .result { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:10px 12px 10px 2.8em; }
  .result { padding:12px; } .oppturn .btn { margin-top:10px; }
  .back { display:inline-flex; align-items:center; min-height:44px; color:var(--mute); font-size:.9rem; text-decoration:none; margin:-8px 0 4px; } .back:hover { color:var(--text); }
  /* The card sheet: rises from the bottom on a phone, a centered panel on a wide screen. */
  #sheet { display:none; } #sheet.open { display:block; }
  .sheet-bg { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:20; }
  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:21; max-height:88vh; overflow:auto; background:var(--panel); border-top:1px solid var(--line); border-radius:12px 12px 0 0; padding:12px 16px calc(16px + env(safe-area-inset-bottom)); box-sizing:border-box; }
  .sheet .sh { position:sticky; top:-12px; background:var(--panel); padding:4px 0 8px; margin:0; font-size:1.05rem; } .sheet .x { min-height:36px; }
  .sbody { display:flex; flex-direction:column; gap:12px; } .sbody .art.big { max-width:200px; }
  .sinfo { font-size:.9rem; } .sl { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:6px; } .sl.mute { color:var(--mute); font-size:.85rem; }
  .sa { border-top:1px solid var(--line); padding:8px 0 2px; } .sa .atk { font-size:.95rem; } .tx { margin:4px 0 6px; color:var(--mute); font-size:.85rem; line-height:1.45; }
  .sinfo .wr { border-top:1px solid var(--line); padding-top:8px; font-size:.85rem; }
  @media (min-width:700px) {
    .sheet { left:50%; right:auto; bottom:auto; top:50%; transform:translate(-50%,-50%); width:min(720px, calc(100vw - 32px)); border:1px solid var(--line); border-radius:10px; padding:14px 18px 18px; }
    .sbody { flex-direction:row; align-items:flex-start; } .sbody .art.big { width:250px; max-width:250px; margin:0; } .sinfo { flex:1; min-width:0; }
  }
</style>
</head>
<body>
<a class="back" href="../">Back to RdyDeck</a>
<h1 data-no-tr><span class="r">Rdy</span>Deck Sparring</h1>
<div id="app"></div>
<div id="sheet"></div>
<script src="../puzzle/text.js"></script>
<script src="../puzzle/engine.js"></script>
<script src="game.js"></script>
<script src="effects.js"></script>
<script src="ai.js"></script>
<script src="decks.js"></script>
<script src="own.js"></script>
<script src="play.js"></script>
<script src="../js/i18n.js"></script>
<template id="i18n-files"><script src="../js/i18n-fr.js"></script><script src="../js/i18n-de.js"></script><script src="../js/i18n-it.js"></script></template>
<script>rdI18n.addCardNames(Object.keys(RdyOppDecks.cards));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && window.RdyPlay) RdyPlay.shut(); });</script>
</body>
</html>
