name: Audit lists (temporary)
on:
  push:
    branches: [audit-lists-tmp]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node audit-lists.mjs .github/matchups-cache.json audit-lists.json
      - run: echo "B64START $(gzip -9c audit-lists.json | base64 -w 0) B64END"
