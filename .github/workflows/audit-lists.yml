name: Audit lists (temporary)
on:
  push:
    branches: [audit-lists-tmp]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node audit-lists.mjs .github/matchups-cache.json audit-lists.json
      - uses: actions/upload-artifact@v4
        with:
          name: audit-lists
          path: audit-lists.json
