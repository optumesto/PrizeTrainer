# Refreshes data.json once a week: current meta and starter decks from Limitless (and builder.json,
# what winning lists run, for the deck builder), the deck builder's card list (cards.json),
# new set codes from TCGdex. Rotation is never changed here; edit it by hand.
# Then checks every starter card and the two newest sets against both card databases,
# writes gap fixes into data.json and a plain report to card-check.md.
# Then builds matchups.json (deck vs deck win rates) from Limitless online tournaments and local
# in-person store events (16 to 63 players, with decklists), and from the online reads meta-cards.json (what each deck's lists run, for the deck builder).
# Then refreshes the facts behind the Grade tab's Watch out for box (watch-out-data.mjs).
# Last, checks how well grades track those results and writes grade-results.md, and the public
# scoreboard (accuracy.json, shown on how-grading-works.html and in the app).
name: Refresh data.json

on:
  schedule:
    - cron: '17 9 * * 1'   # every Monday at 09:17 UTC
  workflow_dispatch:         # adds a "Run workflow" button on the Actions tab
    inputs:
      backfill:
        description: 'Read up to 150 new tournaments for matchups.json (to fill a wider window at once)'
        type: boolean
        default: false
      cards_only:
        description: 'Only read earlier tournaments again for the deck builder card data (meta-cards.json); leaves everything else alone'
        type: boolean
        default: false
      slow:
        description: 'Only read new tournaments for matchups.json and the card data, 30 seconds apart, 25 a run (about 30 requests per 15 minutes)'
        type: boolean
        default: false

permissions:
  contents: write            # lets the job commit data.json back to this repo

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # Nov 19 2026: up to 100 more requests for local in-person events. 3.0: Limitless requests go 30 seconds apart (about 30 per 15 minutes), so a full run can take about 70 minutes; a cards_only run reads about 300 requests 5 seconds apart
    env:
      # 3.0: every Limitless request waits 30 seconds, about 30 per 15 minutes (Mason, Nov 13 2026).
      # The one-off cards_only run keeps its own 5 second pace.
      PT_PAUSE_MS: ${{ inputs.cards_only && '' || '30000' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0     # full history, so update-sitemap.mjs can read when each page changed

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Refresh data.json
        if: ${{ !inputs.cards_only && !inputs.slow }}
        run: node refresh-data.mjs data.json builder.json

      - name: Refresh the deck builder's card list
        if: ${{ !inputs.cards_only && !inputs.slow }}
        # A failed run keeps last week's cards.json; it never blocks the refresh.
        continue-on-error: true
        run: node build-cards.mjs cards.json data.json

      - name: Check card facts
        if: ${{ !inputs.cards_only && !inputs.slow }}
        # A failed check never blocks the refresh; card-check.md says what happened.
        continue-on-error: true
        run: node check-cards.mjs data.json card-check.md index.html

      - name: Refresh matchups.json
        # A failed run keeps last week's matchups; it never blocks data.json.
        continue-on-error: true
        env:
          PT_BACKFILL: ${{ inputs.backfill && '1' || '' }}
          PT_CARDS_ONLY: ${{ inputs.cards_only && '1' || '' }}
          PT_SLOW: ${{ inputs.slow && '1' || '' }}
          # Nov 19 2026: local in-person store events as their own source, up to 100 requests a week (Mason, Nov 19 2026).
          PT_IP_CALLS: ${{ inputs.cards_only && '' || '100' }}
          PT_IP_MIN: '16'
        run: node refresh-matchups.mjs matchups.json .github/matchups-cache.json data.json

      - name: Refresh the quick add top lists
        if: ${{ !inputs.cards_only }}
        # 3.6.0: each deck's best tournament list (top-lists.json), from the events matchups.json just used.
        # Reads only the standings of the events those lists came from, once each, at the same pace.
        # A failed run keeps last week's lists; it never blocks the refresh.
        continue-on-error: true
        run: node top-lists.mjs top-lists.json .github/top-lists-cache.json .github/matchups-cache.json matchups.json cards.json

      - name: Refresh the Watch out for box
        if: ${{ !inputs.slow }}
        # Which types each meta deck attacks with, and who plays the cards the box warns about, from
        # this week's meta-cards.json and pokemon-tcg-data card text, into js/v83-watch-out.js.
        # The stamp step gives index.html the file's new ?v= so browsers fetch it.
        # A failed run keeps last week's facts; it never blocks the refresh.
        continue-on-error: true
        run: |
          node watch-out-data.mjs
          node app-file.mjs --stamp

      - name: Check grades against results
        if: ${{ !inputs.cards_only && !inputs.slow }}
        # Ranks archetypes by grade and by this week's results and writes grade-results.md.
        # A failed run keeps last week's report; it never blocks the refresh.
        continue-on-error: true
        run: |
          npm ci --prefix tests --no-audit --no-fund
          node tests/grade-check.mjs --results=grade-results.md --board=accuracy.json

      - name: Update the accuracy scoreboard page
        if: ${{ !inputs.cards_only && !inputs.slow }}
        # Writes accuracy.json's numbers into how-grading-works.html (How accurate the grades are).
        # A failed run keeps last week's page; it never blocks the refresh.
        continue-on-error: true
        run: node build-pages.mjs --only=how-grading-works.html

      - name: Top decks without a deck guide
        if: ${{ !inputs.cards_only && !inputs.slow }}
        # Lists any deck on the home screen's Top decks without a guide, as a notice on this run.
        # Writes nothing and never blocks the refresh. See tests/top-decks-guides-check.mjs.
        continue-on-error: true
        run: node tests/top-decks-guides-check.mjs

      - name: Update sitemap dates
        if: ${{ !inputs.cards_only && !inputs.slow }}
        # A failed run keeps the old dates; it never blocks the refresh.
        continue-on-error: true
        run: node update-sitemap.mjs sitemap.xml

      - name: Commit if it changed
        run: |
          FILES="top-lists.json .github/top-lists-cache.json data.json builder.json cards.json prints.json card-check.md matchups.json .github/matchups-cache.json meta-cards.json .github/cards-cache.json sitemap.xml grade-results.md accuracy.json how-grading-works.html js/v83-watch-out.js index.html"
          if git diff --quiet -- $FILES && [ -z "$(git ls-files --others --exclude-standard $FILES)" ]; then
            echo "No change this week."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in $FILES; do [ -e "$f" ] && git add "$f"; done
          git commit -m "Weekly data refresh and card check"
          # Someone may have pushed while the job ran; put this commit on top first.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
