# Refreshes data.json once a week: current meta and starter decks from Limitless,
# new set codes from TCGdex. Rotation is never changed here; edit it by hand.
# Then checks every starter card and the two newest sets against both card databases,
# writes gap fixes into data.json and a plain report to card-check.md.
# Last, builds matchups.json (deck vs deck win rates) from Limitless online tournaments.
name: Refresh data.json

on:
  schedule:
    - cron: '17 9 * * 1'   # every Monday at 09:17 UTC
  workflow_dispatch:         # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write            # lets the job commit data.json back to this repo

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Refresh data.json
        run: node refresh-data.mjs data.json

      - name: Check card facts
        # A failed check never blocks the refresh; card-check.md says what happened.
        continue-on-error: true
        run: node check-cards.mjs data.json card-check.md index.html

      - name: Refresh matchups.json
        # A failed run keeps last week's matchups; it never blocks data.json.
        continue-on-error: true
        run: node refresh-matchups.mjs matchups.json .github/matchups-cache.json data.json

      - name: Commit if it changed
        run: |
          FILES="data.json card-check.md matchups.json .github/matchups-cache.json"
          if git diff --quiet -- $FILES && [ -z "$(git ls-files --others --exclude-standard $FILES)" ]; then
            echo "No change this week."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in $FILES; do [ -e "$f" ] && git add "$f"; done
          git commit -m "Weekly data refresh and card check"
          git push
