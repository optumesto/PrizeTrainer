# Temporary: screenshots of Guess the Grade for review. Remove before merging.
name: Guess the Grade screenshots
on:
  push:
    branches: [gtg-shots-tool2]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Take screenshots
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm install --no-save --no-package-lock playwright@1.56.1
          if command -v google-chrome >/dev/null; then export PW_CHANNEL=chrome; else npx playwright install chromium; fi
          cd "$GITHUB_WORKSPACE"
          npx --yes http-server@14.1.1 -p 8080 -s -c-1 &
          sleep 3
          cp shots-tool/gtg-shots.mjs /tmp/pw/ && cd /tmp/pw && node gtg-shots.mjs http://127.0.0.1:8080/ /tmp/out
      - name: Push them to gtg-shots
        run: |
          cd /tmp/out
          git init -q -b gtg-shots && git config user.name "github-actions[bot]" && git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "GTG home shots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gtg-shots
