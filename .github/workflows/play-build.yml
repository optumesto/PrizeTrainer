# Play build: makes the RdyDeck Android app (a Trusted Web Activity for
# rdydeck.com) from play/twa-manifest.json with Bubblewrap.
# It builds UNSIGNED. No keystore, key or password is ever in this repo or
# this job. Sign the bundle on your own computer (see play/BUILD-PLAY.md).
# Runs on the play-package branch only, or from the Actions tab.
name: Play build

on:
  push:
    branches: [play-package, play-cutout]
    paths:
      - 'play/twa-manifest.json'
      - '.github/workflows/play-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Bubblewrap
        run: npm i -g @bubblewrap/cli@1.27.0

      - name: Point Bubblewrap at this machine's JDK and Android SDK
        run: |
          # Bubblewrap looks for sdkmanager under tools/ or bin/; the runner has it under cmdline-tools/latest.
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          sudo ln -sfn "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"
          yes | sudo "$SDKM" --sdk_root="$ANDROID_HOME" "build-tools;36.1.0" "platforms;android-36" > /dev/null
          sudo chmod -R a+rwX "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms"
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json

      - name: Make the Android project
        run: |
          mkdir app
          # Launcher icon: the Play store icon from play/store-assets, pinned to this commit.
          jq --arg icon "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/play/store-assets/icon-512.png" \
            '.iconUrl = $icon' play/twa-manifest.json > app/twa-manifest.json
          cd app
          bubblewrap update --skipVersionUpgrade < /dev/null

      - name: Fill the screen in landscape (draw into the camera cutout)
        run: |
          # androidbrowserhelper has no setting for the cutout, so override getDisplayMode()
          # in the generated LauncherActivity: immersive, laid out into the short-edge cutout.
          F=$(find app/app/src/main/java -name LauncherActivity.java)
          python3 - "$F" <<'PY'
          import sys
          f = sys.argv[1]
          s = open(f).read()
          s = s.replace("import android.os.Bundle;", "import android.os.Bundle;\nimport android.view.WindowManager;\nimport androidx.browser.trusted.TrustedWebActivityDisplayMode;", 1)
          i = s.rindex("}")
          s = s[:i] + """
              @Override
              protected TrustedWebActivityDisplayMode getDisplayMode() {
                  return new TrustedWebActivityDisplayMode.ImmersiveMode(false,
                          WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES);
              }
          }
          """
          open(f, "w").write(s)
          PY
          grep -n "getDisplayMode\|SHORT_EDGES" "$F"

      - name: Build (unsigned)
        working-directory: app
        run: bubblewrap build --skipSigning < /dev/null

      - name: Collect the output
        run: |
          mkdir out
          cp app/app/build/outputs/bundle/release/app-release.aab out/rdydeck-$(jq -r .appVersionName app/twa-manifest.json)-unsigned.aab
          cp app/twa-manifest.json out/
          cd out && sha256sum * > SHA256SUMS.txt && ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: rdydeck-play-unsigned
          path: out/
          retention-days: 30
