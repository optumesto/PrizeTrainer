# Test branch only (remove before merging to main): before and after screenshots
# of the goldfish and daily puzzle boards, uploaded as a run artifact.
name: Board screenshots
on:
  push:
    branches: [board-look]
  workflow_dispatch:
permissions:
  contents: write   # pushes the pictures to the board-look-shots branch
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: { path: after }
      - uses: actions/checkout@v5
        with: { ref: main, path: before }
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Install playwright-core
        run: cd after/shots && npm init -y >/dev/null && npm i playwright-core@1.48.2 --no-audit --no-fund
      - name: Serve both copies
        run: |
          (cd before && python3 -m http.server 8001 >/dev/null 2>&1 &)
          (cd after && python3 -m http.server 8002 >/dev/null 2>&1 &)
          sleep 2
      - name: Screenshots
        run: |
          cd after/shots
          node shoot.mjs http://localhost:8001 ../../out before
          node shoot.mjs http://localhost:8002 ../../out after
      - name: Push the pictures to board-look-shots
        run: |
          cd out
          git init -q -b board-look-shots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Board screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" board-look-shots
