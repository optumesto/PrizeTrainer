# Builds art-index.json and art-index.bin (photo deck import: a fingerprint of every Standard
# legal print's picture), then checks photo import on test screenshots and keeps them as a
# download (Actions > this run > Artifacts) for a closer look.
name: Photo import index

on:
  workflow_dispatch:
  push:
    branches: [photo-import]
    paths:
      - build-art-index.mjs
      - js/photo-scan.js
      - tests/photo-import/**
      - tests/photo-import-check.mjs
      - .github/workflows/art-index.yml

permissions:
  contents: write

concurrency:
  group: art-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install sharp (reads card pictures; not part of the site)
        run: npm install --no-save --no-package-lock sharp@0.34.3
      - name: Build the art index
        run: node build-art-index.mjs art-index.json art-index.bin data.json
      - name: Make test screenshots
        run: node tests/photo-import/make-shots.mjs shots
      - name: Check photo import
        run: SHOW=80 node tests/photo-import-check.mjs shots art-index.json art-index.bin | tee shots/result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: photo-import-shots
          path: |
            shots
            art-index.json
            art-index.bin
          retention-days: 7
      - name: Commit the index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add art-index.json art-index.bin
          if git diff --cached --quiet; then echo "Index unchanged."; exit 0; fi
          git commit -m "Photo import: rebuild the art index"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
