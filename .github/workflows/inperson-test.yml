# 3.5 test, branch inperson-results only: reads Limitless in-person events (store leagues and
# locals) into .github/matchups-cache.json as the "inperson" source, at the weekly job's pace
# (30 seconds apart, about 30 requests per 15 minutes), and commits the result to this branch.
# Runs when .github/inperson-run.txt changes on this branch. Never touches main or the live site.
name: In-person test read

on:
  push:
    branches: [inperson-results]
    paths: ['.github/inperson-run.txt']

permissions:
  contents: write

concurrency:
  group: refresh-data       # never at the same time as the weekly data job
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PT_PAUSE_MS: '30000'
      PT_IP_CALLS: '400'
      PT_IP_MIN: '16'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Read in-person events
        continue-on-error: true
        run: node refresh-matchups.mjs matchups.json .github/matchups-cache.json data.json
      - name: Commit to this branch
        run: |
          FILES="matchups.json .github/matchups-cache.json meta-cards.json .github/cards-cache.json"
          if git diff --quiet -- $FILES; then echo "Nothing new."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "In-person test read"
          git pull --rebase origin inperson-results
          git push origin HEAD:inperson-results
