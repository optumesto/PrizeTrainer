<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#131210">
<title>Page Not Found | RdyDeck</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<style>
  @font-face { font-family:'Saira'; src:url('/saira.woff2') format('woff2'); font-weight:100 900; font-display:swap; }
  :root { color-scheme:dark; }
  html, body { margin:0; height:100%; background:#131210; color:#ede8de; font-family:'Saira', system-ui, sans-serif; }
  main { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px 16px; box-sizing:border-box; }
  img { width:72px; height:72px; margin-bottom:18px; }
  h1 { font-size:1.5rem; margin:0 0 0.5rem; font-weight:700; }
  .brand { font-size:1.1rem; font-weight:700; margin:0 0 0.4rem; color:#ede8de; }
  .brand .r { color:#e5483a; }
  p { margin:0 0 1.4rem; max-width:22rem; line-height:1.5; color:#bdb6a9; }
  a.b { display:inline-flex; align-items:center; font-weight:600; background:#ede8de; color:#131210; border-radius:4px; min-height:44px; padding:0 22px; text-decoration:none; }
  nav { margin-top:1.6rem; display:flex; flex-wrap:wrap; gap:8px 18px; justify-content:center; }
  nav a { color:#bdb6a9; }
</style>
</head>
<body>
<main>
  <img src="/icon-192x192.png" alt="">
  <div class="brand"><span class="r">Rdy</span>Deck</div>
  <h1 id="nf-h">Page Not Found</h1>
  <p id="nf-p">This page doesn't exist. Your decks are safe on the home screen.</p>
  <a class="b" id="nf-b" href="/">Open RdyDeck</a>
  <nav>
    <a href="/deck-grader.html">Deck Grader</a>
    <a href="/opening-odds.html">Opening Odds</a>
    <a href="/prize-trainer.html">Prize Trainer</a>
    <a href="/goldfish.html">Goldfish</a>
    <a href="/rotation.html">Rotation</a>
    <a href="/meta-decks.html">Deck Guides</a>
    <a href="/cards/">Card Guides</a>
    <a href="/daily-games.html">Daily Games</a>
    <a href="/how-grading-works.html">How Grading Works</a>
    <a href="/faq.html">FAQ</a>
    <a href="/about.html">About</a>
    <a href="/contact.html">Contact</a>
  </nav>
</main>
<script>
// On the old GitHub Pages address, try the same path on rdydeck.com, which shows
// its own page or its own "page not found".
(function () {
  if (location.hostname !== 'optumesto.github.io') return;
  location.replace('https://rdydeck.com/' + location.pathname.replace(/^\/PrizeTrainer\/?/i, '') + location.search + location.hash);
})();
</script>
<script>
// The heading, line and button in the app's language. The guide links stay English, like the guides.
(function () {
  var T = {
    es: ['Página no encontrada', 'Esta página no existe. Tus barajas están a salvo en la pantalla de inicio.', 'Abrir RdyDeck'],
    pt: ['Página não encontrada', 'Esta página não existe. Seus decks estão seguros na tela inicial.', 'Abrir RdyDeck'],
    fr: ['Page introuvable', "Cette page n'existe pas. Vos decks sont en sécurité sur l'écran d'accueil.", 'Ouvrir RdyDeck'],
    de: ['Seite nicht gefunden', 'Diese Seite gibt es nicht. Deine Decks sind sicher auf dem Startbildschirm.', 'RdyDeck öffnen'],
    it: ['Pagina non trovata', 'Questa pagina non esiste. I tuoi mazzi sono al sicuro nella schermata iniziale.', 'Apri RdyDeck']
  };
  var l = '';
  try { l = localStorage.getItem('rd_lang') || ''; } catch (e) {}
  if (!l) l = String((navigator.languages && navigator.languages[0]) || navigator.language || '').toLowerCase().slice(0, 2);
  var t = T[l]; if (!t) return;
  document.documentElement.lang = l;
  document.getElementById('nf-h').textContent = t[0];
  document.getElementById('nf-p').textContent = t[1];
  document.getElementById('nf-b').textContent = t[2];
})();
</script>
</body>
</html>
